# Kong declarative config (DB-less). Single public entry point for the web app.
# Kong owns: routing to the right microservice, edge JWT verification, rate
# limiting, CORS. Fine-grained RBAC stays inside each service.
_format_version: '3.0'

services:
  - name: auth-service
    url: http://ucc-auth-service:5002
    routes:
      # Public marketing-site content (categories/services/faqs/careers/
      # locations/testimonials, plus contact/testimonial submit) — no JWT.
      # Declared before auth-public so its more specific path wins.
      - name: auth-public-content
        paths: ['/api/auth/public']
        strip_path: false
      - name: auth-public # register/login/otp/forgot — no JWT required
        paths: ['/api/auth']
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 30, policy: local } # tight on auth

  - name: core-service
    url: http://ucc-core-service:5003
    routes:
      - name: core-protected
        paths: ['/api/patients']
        strip_path: false
        plugins:
          - name: jwt
      # Guest-first appointment booking — no edge JWT; endpoints that need a
      # session (e.g. /bookings/mine) verify the token in-service.
      - name: core-scheduling-public
        paths: ['/api/scheduling']
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 300, policy: local }

  - name: billing-service
    url: http://ucc-billing-service:5005
    routes:
      # Stripe can't send a bearer token — signature verification happens
      # in-service instead. Must be declared before billing-protected so its
      # more specific path wins.
      - name: billing-webhooks-public
        paths: ['/api/billing/webhooks']
        strip_path: false
      - name: billing-protected
        paths: ['/api/billing']
        strip_path: false
        plugins:
          - name: jwt

  - name: superadmin-service
    url: http://ucc-superadmin-service:5008
    routes:
      - name: superadmin-protected
        paths: ['/api/admin']
        strip_path: false
    plugins:
      - name: jwt

  - name: notification-service
    url: http://ucc-notification-service:5009
    routes:
      - name: notification-protected
        paths: ['/api/notifications', '/api/comms']
        strip_path: false
    plugins:
      - name: jwt

# JWT credential — the HS256 secret MUST match the services' JWT_SECRET from
# apigateway-service/.env (key = iss claim), or every jwt-plugin route 401s
# with "Invalid signature". In production prefer RS256 + a JWKS endpoint.
consumers:
  - username: ucc-platform
    jwt_secrets:
      - key: ucc-auth
        algorithm: HS256
        secret: 9c4f7d2a8b1e5f6d3c8a9b7e1f2d4c6a7b8e9f1d2c3a4b5e6f7a8b9c0d1e2f3

plugins:
  - name: cors
    config:
      origins: ['*']
      credentials: true
      methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
  - name: correlation-id
    config: { header_name: X-Request-Id, generator: uuid }
