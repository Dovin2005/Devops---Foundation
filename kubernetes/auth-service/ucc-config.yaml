apiVersion: v1
kind: ConfigMap
metadata:
  name: ucc-config
  namespace: ucc
data:
  NODE_ENV: "development"

  DB_HOST: "aws-0-ap-southeast-1.pooler.supabase.com"
  DB_PORT: "6543"
  DB_NAME: "postgres"
  DATABASE_URL_EXTRA: "&sslmode=require"

  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_TOKEN_EXPIRES_IN: "7d"

  KONG_DATABASE: "off"
  KONG_DECLARATIVE_CONFIG: "./kong.dev.yml"
  KONG_PROXY_LISTEN: "0.0.0.0:5000"
  KONG_PROXY_PORT: "5000"
  KONG_ADMIN_LISTEN: "0.0.0.0:5001"
  KONG_ADMIN_PORT: "5001"
  KONG_JWT_KEY: "ucc"

  NOTIFICATION_TRANSPORT: "console"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "no-reply@example.com"
  SMTP_FROM: "no-reply@example.com"

  AUTH_SERVICE_PORT: "5002"
  AUTH_SERVICE_NAME: "ucc-auth-service"

  CORE_SERVICE_PORT: "5003"
  CORE_SERVICE_NAME: "ucc-core-service"

  CLINICAL_SERVICE_PORT: "5004"
  CLINICAL_SERVICE_NAME: "ucc-clinical-service"

  BILLING_SERVICE_PORT: "5005"
  BILLING_SERVICE_NAME: "ucc-billing-service"

  COMMERCE_SERVICE_PORT: "5006"
  COMMERCE_SERVICE_NAME: "ucc-commerce-service"

  MARKETING_SERVICE_PORT: "5007"
  MARKETING_SERVICE_NAME: "ucc-marketing-service"

  SUPERADMIN_SERVICE_PORT: "5008"
  SUPERADMIN_SERVICE_NAME: "ucc-superadmin-service"

  NOTIFICATION_SERVICE_PORT: "5009"
  NOTIFICATION_SERVICE_NAME: "ucc-notification-service"
