apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ucc

data:
  default.conf: |

    upstream frontend {
        server frontend:80;
    }

    upstream kong {
        server kong:8000;
    }

    #
    # Redirect HTTP -> HTTPS
    #
    server {
        listen 80;
        server_name ucc.dovin.xyz ucc-api.dovin.xyz;

        return 301 https://$host$request_uri;
    }

    #
    # Frontend
    #
    server {
        listen 443 ssl;
        http2 on;

        server_name ucc.dovin.xyz;

        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        location / {

            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    #
    # API
    #
    server {
        listen 443 ssl;
        http2 on;

        server_name ucc-api.dovin.xyz;

        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        location / {

            proxy_pass http://kong;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
