apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: ucc

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx

        image: nginx:1.29-alpine
        imagePullPolicy: Always

        ports:
        - containerPort: 80

        - containerPort: 443

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d

        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config

      - name: ssl-certs
        secret:
          secretName: dovin-ssl
