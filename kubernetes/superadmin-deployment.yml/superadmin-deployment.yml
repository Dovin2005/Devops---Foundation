apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucc-superadmin-service
  namespace: ucc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ucc-superadmin-service
  template:
    metadata:
      labels:
        app: ucc-superadmin-service
    spec:
      containers:
        - name: ucc-superadmin-service
          image: 034384198565.dkr.ecr.ap-south-1.amazonaws.com/ucc-project:superadmin-v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5005

          env:
            - name: PORT
              value: "5005"

          envFrom:
            - secretRef:
                name: ucc-secret
            - configMapRef:
                name: ucc-config

