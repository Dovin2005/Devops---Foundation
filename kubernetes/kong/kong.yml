# Kong declarative config (DB-less)
_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:5002
    routes:
      - name: auth-public-content
        paths:
          - /api/auth/public
        strip_path: false

      - name: auth-public
        paths:
          - /api/auth
        strip_path: false

    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  - name: core-service
    url: http://core-service:5003
    routes:
      - name: core-protected
        paths:
          - /api/patients
        strip_path: false
        plugins:
          - name: jwt

      - name: core-scheduling-public
        paths:
          - /api/scheduling
        strip_path: false

    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: billing-service
    url: http://billing-service:5008
    routes:
      - name: billing-webhooks-public
        paths:
          - /api/billing/webhooks
        strip_path: false

      - name: billing-protected
        paths:
          - /api/billing
        strip_path: false
        plugins:
          - name: jwt

  - name: ucc-superadmin-service
    url: http://ucc-superadmin-service:5005
    routes:
      - name: superadmin-protected
        paths:
          - /api/admin
        strip_path: false

    plugins:
      - name: jwt

  - name: notification-service
    url: http://notification-service:5009
    routes:
      - name: notification-protected
        paths:
          - /api/notifications
          - /api/comms
        strip_path: false

    plugins:
      - name: jwt

consumers:
  - username: ucc-platform
    jwt_secrets:
      - key: ucc-auth
        algorithm: HS256
        secret: 9c4f7d2a8b1e5f6d3c8a9b7e1f2d4c6a7b8e9f1d2c3a4b5e6f7a8b9c0d1e2f3

plugins:
  - name: cors
    config:
      origins:
        - "*"
      credentials: true
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
