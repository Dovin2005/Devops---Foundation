# 🔹 Install base packages
- name: Install base packages
  apt:
    name:
      - wget
      - tar
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: yes

# 🔹 Add Grafana GPG key
- name: Add Grafana GPG key
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

# 🔹 Add Grafana repository
- name: Add Grafana repo
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present

# 🔹 Update apt cache
- name: Update apt cache
  apt:
    update_cache: yes

# 🔹 Install Grafana
- name: Install Grafana
  apt:
    name: grafana
    state: present

# 🔹 Start Grafana
- name: Start Grafana
  service:
    name: grafana-server
    state: started
    enabled: yes


# =========================
# 🔥 PROMETHEUS SETUP
# =========================

# 🔹 Download Prometheus
- name: Download Prometheus
  get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v2.48.0/prometheus-2.48.0.linux-amd64.tar.gz
    dest: /tmp/prometheus.tar.gz

# 🔹 Extract Prometheus
- name: Extract Prometheus
  unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /opt/
    remote_src: yes

# 🔹 Create Prometheus user
- name: Create Prometheus user
  user:
    name: prometheus
    shell: /bin/false

# 🔹 Create directories
- name: Create Prometheus directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

# 🔥 Fix Prometheus permissions
- name: Set ownership for Prometheus directories
  file:
    path: "{{ item }}"
    owner: prometheus
    group: prometheus
    recurse: yes
  loop:
    - /var/lib/prometheus
    - /etc/prometheus

# 🔹 Move binaries
- name: Copy Prometheus binary
  copy:
    src: /opt/prometheus-2.48.0.linux-amd64/prometheus
    dest: /usr/local/bin/prometheus
    remote_src: yes
    mode: '0755'

- name: Copy promtool binary
  copy:
    src: /opt/prometheus-2.48.0.linux-amd64/promtool
    dest: /usr/local/bin/promtool
    remote_src: yes
    mode: '0755'

# 🔹 Create basic config file
- name: Create Prometheus config
  copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

# 🔹 Create systemd service
- name: Create Prometheus service file
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus Monitoring
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus

      [Install]
      WantedBy=multi-user.target

# 🔹 Reload systemd
- name: Reload systemd
  command: systemctl daemon-reexec

# 🔹 Start Prometheus
- name: Start Prometheus
  service:
    name: prometheus
    state: started
    enabled: yes
